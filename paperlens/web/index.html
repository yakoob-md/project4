<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PaperLens</title><link rel="stylesheet" href="/assets/style.css"><main><header><strong>PaperLens</strong><span>Research workspace</span></header><h1>Investigate your research.</h1><form id="intake"><label>Workflow<select name="mode"><option value="paper">Review a paper</option><option value="idea">Explore a research idea</option></select></label><label id="upload">Paper PDF<input type="file" name="pdf" accept="application/pdf"></label><label id="context">Submission text<textarea name="text" rows="6"></textarea></label><label>Research question or search terms<input name="question" maxlength="500"></label><label>Literature cutoff<input type="date" name="cutoff" required></label><p>Search terms go to arXiv. If left blank, the opening excerpt is used. Model-enabled runs send selected passages to the configured research model.</p><button>Run analysis</button></form><p role="status" id="status"></p><article id="report"></article><aside><h2>Previous runs</h2><div id="historyList"></div></aside></main><script src="/assets/app.js"></script></html>
